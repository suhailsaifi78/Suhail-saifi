<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#07080c;
    --bg2:#0d1017;

    --card:rgba(255,255,255,.055);
    --card2:rgba(255,255,255,.085);

    --text:#f5f7fb;
    --muted:#9ca3af;

    --line:rgba(255,255,255,.10);

    --accent:#7c5cff;
    --accent2:#00d4ff;

    --success:#31e981;
    --danger:#ff5d73;

    --shadow:
        0 25px 70px rgba(0,0,0,.45);

    --radius:24px;

}

.light{

    --bg:#f5f7fb;
    --bg2:#ffffff;

    --card:rgba(0,0,0,.045);
    --card2:rgba(0,0,0,.075);

    --text:#111827;
    --muted:#5f6673;

    --line:rgba(0,0,0,.10);

    --shadow:
        0 20px 60px rgba(0,0,0,.12);

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    scroll-behavior:smooth;

}

body{

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(124,92,255,.15),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(0,212,255,.10),
            transparent 28%
        ),

        var(--bg);

    color:var(--text);

    overflow-x:hidden;

}

a{

    color:inherit;

    text-decoration:none;

}

button,
input,
textarea{

    font-family:inherit;

}

.container{

    width:min(1120px,92%);

    margin:auto;

}


/* =====================================================
   BACKGROUND
===================================================== */

.bg-orb{

    position:fixed;

    width:300px;
    height:300px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.12;

    pointer-events:none;

    z-index:-1;

}

.orb1{

    background:#7c5cff;

    top:10%;

    left:-100px;

}

.orb2{

    background:#00d4ff;

    right:-100px;

    top:55%;

}


/* =====================================================
   NAVBAR
===================================================== */

header{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:1000;

    backdrop-filter:blur(18px);

    background:rgba(7,8,12,.68);

    border-bottom:1px solid var(--line);

}

.light header{

    background:rgba(255,255,255,.75);

}

.nav{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.logo{

    font-size:21px;

    font-weight:800;

    letter-spacing:-.5px;

}

.logo span{

    color:var(--accent);

}

.nav-links{

    display:flex;

    gap:26px;

    align-items:center;

}

.nav-links a{

    color:var(--muted);

    font-size:14px;

    transition:.25s;

}

.nav-links a:hover{

    color:var(--text);

}

.nav-actions{

    display:flex;

    gap:9px;

}

.icon-btn{

    width:40px;

    height:40px;

    border-radius:50%;

    border:1px solid var(--line);

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    font-size:16px;

}

.menu{

    display:none;

}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:100vh;

    display:flex;

    align-items:center;

    padding-top:90px;

}

.hero-grid{

    display:grid;

    grid-template-columns:1.25fr .75fr;

    gap:60px;

    align-items:center;

}

.badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    border:1px solid var(--line);

    background:var(--card);

    padding:8px 14px;

    border-radius:999px;

    color:var(--muted);

    font-size:13px;

    margin-bottom:22px;

}

.dot{

    width:8px;

    height:8px;

    background:var(--success);

    border-radius:50%;

    box-shadow:
        0 0 14px var(--success);

}

.hero h1{

    font-size:
        clamp(44px,7vw,78px);

    line-height:.98;

    letter-spacing:-4px;

    margin-bottom:22px;

}

.gradient{

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent2)
        );

    -webkit-background-clip:text;

    color:transparent;

}

.hero p{

    color:var(--muted);

    font-size:18px;

    line-height:1.8;

    max-width:650px;

}

.buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:30px;

}

.btn{

    padding:13px 20px;

    border-radius:14px;

    border:1px solid var(--line);

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    font-weight:600;

    transition:.3s;

}

.btn:hover{

    transform:translateY(-3px);

}

.btn-primary{

    background:
        linear-gradient(
            135deg,
            var(--accent),
            #5940e8
        );

    border:none;

    color:white;

    box-shadow:
        0 10px 35px
        rgba(124,92,255,.28);

}


/* =====================================================
   PROFILE
===================================================== */

.profile-card{

    position:relative;

    padding:35px;

    border:1px solid var(--line);

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            var(--card2),
            rgba(255,255,255,.02)
        );

    box-shadow:var(--shadow);

    text-align:center;

    overflow:hidden;

}

.avatar{

    width:145px;

    height:145px;

    margin:auto;

    border-radius:50%;

    display:grid;

    place-items:center;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-size:42px;

    font-weight:800;

    box-shadow:
        0 0 60px
        rgba(124,92,255,.35);

}

.profile-card h3{

    margin-top:22px;

    font-size:24px;

}

.profile-card p{

    color:var(--muted);

    margin-top:7px;

}

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-top:18px;

}

.stat{

    padding:18px;

    border:1px solid var(--line);

    border-radius:18px;

    background:var(--card);

}

.stat strong{

    display:block;

    font-size:25px;

}

.stat span{

    color:var(--muted);

    font-size:12px;

}


/* =====================================================
   SECTIONS
===================================================== */

section{

    padding:100px 0;

}

.section-head{

    margin-bottom:45px;

}

.eyebrow{

    color:var(--accent2);

    font-size:13px;

    text-transform:uppercase;

    letter-spacing:2px;

    font-weight:700;

    margin-bottom:10px;

}

.section-head h2{

    font-size:
        clamp(30px,5vw,48px);

    letter-spacing:-2px;

}

.section-head p{

    color:var(--muted);

    margin-top:12px;

}


/* =====================================================
   CARDS
===================================================== */

.card{

    border:1px solid var(--line);

    background:var(--card);

    border-radius:var(--radius);

    padding:28px;

    transition:.3s;

}

.card:hover{

    transform:translateY(-5px);

    background:var(--card2);

}

.card h3{

    margin-bottom:12px;

}

.card p{

    color:var(--muted);

    line-height:1.8;

}


/* =====================================================
   ABOUT
===================================================== */

.about-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:20px;

}


/* =====================================================
   SKILLS
===================================================== */

.skills{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

}

.skill{

    padding:12px 16px;

    border-radius:12px;

    border:1px solid var(--line);

    background:var(--card);

    color:var(--muted);

    transition:.25s;

}

.skill:hover{

    color:var(--text);

    border-color:var(--accent);

    transform:translateY(-3px);

}


/* =====================================================
   PROJECTS
===================================================== */

.project-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

}

.project-image{

    height:170px;

    border-radius:18px;

    background:

        linear-gradient(
            135deg,
            rgba(124,92,255,.7),
            rgba(0,212,255,.35)
        );

    display:flex;

    align-items:flex-end;

    padding:20px;

    font-size:30px;

}

.project h3{

    margin-top:20px;

}

.project p{

    margin:9px 0 18px;

}

.tags{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

}

.tag{

    font-size:11px;

    color:var(--muted);

    border:1px solid var(--line);

    padding:5px 9px;

    border-radius:7px;

}


/* =====================================================
   EDUCATION
===================================================== */

.timeline{

    border-left:
        1px solid var(--line);

    margin-left:8px;

}

.timeline-item{

    position:relative;

    padding:
        0 0 35px 30px;

}

.timeline-item::before{

    content:"";

    position:absolute;

    width:12px;

    height:12px;

    border-radius:50%;

    background:var(--accent);

    left:-6px;

    top:4px;

    box-shadow:
        0 0 20px var(--accent);

}

.timeline-item h3{

    margin-bottom:5px;

}

.timeline-item span{

    color:var(--accent2);

    font-size:13px;

}

.timeline-item p{

    color:var(--muted);

    margin-top:8px;

}


/* =====================================================
   ACHIEVEMENTS
===================================================== */

.achievement-feature{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:25px;

    align-items:center;

    margin-bottom:25px;

    padding:25px;

    border:
        1px solid
        rgba(124,92,255,.35);

    border-radius:28px;

    background:

        radial-gradient(
            circle at top right,
            rgba(124,92,255,.18),
            transparent 35%
        ),

        var(--card);

    box-shadow:var(--shadow);

}

.achievement-feature-image{

    min-height:300px;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        linear-gradient(
            135deg,
            rgba(124,92,255,.25),
            rgba(0,212,255,.12)
        );

    border:1px solid var(--line);

    overflow:hidden;

}

.achievement-feature-image img{

    width:100%;

    height:300px;

    object-fit:cover;

    cursor:pointer;

    transition:.4s;

}

.achievement-feature-image img:hover{

    transform:scale(1.04);

}

.achievement-feature-content{

    padding:10px;

}

.achievement-badge{

    display:inline-block;

    padding:7px 12px;

    border-radius:999px;

    background:
        rgba(124,92,255,.12);

    border:
        1px solid
        rgba(124,92,255,.3);

    color:var(--accent2);

    font-size:12px;

    margin-bottom:15px;

}

.achievement-feature h3{

    font-size:30px;

    margin-bottom:12px;

}

.achievement-feature p{

    color:var(--muted);

    line-height:1.8;

}

.achievement-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;

}

.achievement-card{

    padding:16px;

    overflow:hidden;

}

.achievement-image{

    height:180px;

    border-radius:16px;

    overflow:hidden;

    background:

        linear-gradient(
            135deg,
            rgba(124,92,255,.18),
            rgba(0,212,255,.08)
        );

    border:1px solid var(--line);

}

.achievement-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    cursor:pointer;

    transition:.4s;

}

.achievement-image img:hover{

    transform:scale(1.06);

}

.achievement-card h3{

    font-size:17px;

    margin-top:17px;

    margin-bottom:7px;

}

.achievement-card p{

    color:var(--muted);

    font-size:13px;

    line-height:1.6;

}

.view-certificate{

    display:inline-block;

    margin-top:15px;

    color:var(--accent2);

    font-size:13px;

    font-weight:600;

}


/* =====================================================
   CERTIFICATE MODAL
===================================================== */

.certificate-modal{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:25px;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:blur(12px);

}

.certificate-modal.show{

    display:flex;

}

.certificate-modal img{

    max-width:95%;

    max-height:90vh;

    object-fit:contain;

    border-radius:14px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.6);

}

.close-modal{

    position:absolute;

    top:25px;

    right:25px;

    width:45px;

    height:45px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.2);

    background:
        rgba(255,255,255,.1);

    color:white;

    font-size:22px;

    cursor:pointer;

}


/* =====================================================
   AI
===================================================== */

.ai-wrap{

    max-width:900px;

    margin:auto;

}

.ai-card{

    border:
        1px solid
        rgba(124,92,255,.3);

    background:

        radial-gradient(
            circle at top right,
            rgba(124,92,255,.14),
            transparent 30%
        ),

        var(--card);

    border-radius:30px;

    overflow:hidden;

    box-shadow:var(--shadow);

}

.ai-top{

    padding:22px;

    border-bottom:1px solid var(--line);

    display:flex;

    align-items:center;

    gap:13px;

}

.ai-icon{

    width:45px;

    height:45px;

    border-radius:14px;

    display:grid;

    place-items:center;

    background:

        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-size:21px;

}

.ai-top strong{

    display:block;

}

.ai-top small{

    color:var(--success);

}

.chat{

    height:390px;

    padding:22px;

    overflow-y:auto;

}

.message{

    max-width:82%;

    padding:13px 16px;

    border-radius:17px;

    margin-bottom:13px;

    line-height:1.65;

    font-size:14px;

}

.bot{

    background:var(--card2);

    border:1px solid var(--line);

}

.user{

    margin-left:auto;

    background:

        linear-gradient(
            135deg,
            var(--accent),
            #5940e8
        );

    color:white;

}

.typing{

    opacity:.7;

}

.quick{

    padding:
        0 22px 15px;

    display:flex;

    gap:8px;

    flex-wrap:wrap;

}

.quick button{

    border:1px solid var(--line);

    background:var(--card);

    color:var(--muted);

    padding:8px 11px;

    border-radius:10px;

    cursor:pointer;

}

.chat-input{

    display:flex;

    gap:10px;

    padding:15px;

    border-top:1px solid var(--line);

}

.chat-input input{

    flex:1;

    border:1px solid var(--line);

    background:var(--card);

    color:var(--text);

    padding:14px;

    border-radius:13px;

    outline:none;

}

.send{

    width:50px;

    border:none;

    border-radius:13px;

    background:var(--accent);

    color:white;

    cursor:pointer;

}


/* =====================================================
   CONTACT
===================================================== */

.contact-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:20px;

}

.contact-form{

    display:flex;

    flex-direction:column;

    gap:13px;

}

.contact-form input,
.contact-form textarea{

    width:100%;

    border:
        1px solid
        var(--line);

    background:var(--card);

    color:var(--text);

    padding:14px;

    border-radius:13px;

    outline:none;

}

.contact-form textarea{

    min-height:140px;

    resize:vertical;

}

.contact-status{

    min-height:20px;

    font-size:13px;

}

.success{

    color:var(--success);

}

.error{

    color:var(--danger);

}

.contact-item{

    padding:17px 0;

    border-bottom:
        1px solid
        var(--line);

}

.contact-item span{

    color:var(--muted);

    display:block;

    font-size:12px;

    margin-bottom:4px;

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    border-top:
        1px solid
        var(--line);

    padding:30px 0;

    color:var(--muted);

    font-size:13px;

}

.footer-flex{

    display:flex;

    justify-content:space-between;

    gap:20px;

}


/* =====================================================
   ANIMATION
===================================================== */

.reveal{

    opacity:0;

    transform:translateY(25px);

    transition:.7s ease;

}

.reveal.active{

    opacity:1;

    transform:none;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .achievement-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:850px){

    .nav-links{

        position:absolute;

        top:72px;

        left:4%;

        width:92%;

        display:none;

        flex-direction:column;

        padding:20px;

        border:
            1px solid
            var(--line);

        background:var(--bg2);

        border-radius:18px;

    }

    .nav-links.open{

        display:flex;

    }

    .menu{

        display:block;

    }

    .hero-grid{

        grid-template-columns:1fr;

        text-align:center;

    }

    .hero p{

        margin:auto;

    }

    .buttons{

        justify-content:center;

    }

    .profile-card{

        max-width:400px;

        margin:auto;

    }

    .about-grid,
    .contact-grid{

        grid-template-columns:1fr;

    }

    .project-grid{

        grid-template-columns:1fr;

    }

    .footer-flex{

        flex-direction:column;

        text-align:center;

    }

}

@media(max-width:650px){

    .achievement-feature{

        grid-template-columns:1fr;

    }

    .achievement-feature-image,
    .achievement-feature-image img{

        min-height:220px;

        height:220px;

    }

    .achievement-grid{

        grid-template-columns:1fr;

    }

}

@media(max-width:500px){

    section{

        padding:75px 0;

    }

    .hero h1{

        letter-spacing:-2.5px;

    }

    .stats{

        grid-template-columns:1fr;

    }

    .message{

        max-width:92%;

    }

}

</style>

</head>
